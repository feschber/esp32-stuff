<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Magic esp32 Setup</title>
        <style type="text/css">
            body {
                max-width: 50em;
                margin: auto;
                padding: 1em;
                font: 1em/1.65 sans-serif;
            }
            input {
                width: 100%;
                height: 3em;
                margin-bottom: 1em;
            }
        </style>
    </head>
    <body>
        <h1>Magic esp32 Setup</h1>
        <h2>Connect To A WiFi Network</h2>
        <form
            id="the-form"
            action="/wifi_credentials"
            method="post"
            accept-charset="utf-8"
        >
            <label for="ssid">WiFi network (SSID)</label>
            <input type="text" id="ssid" name="ssid" /><br />
            <label for="ssid">WiFi password</label>
            <input type="text" id="password" name="password" /><br />
            <input type="submit" value="Submit" />
        </form>
        <p id="server-resp"></p>
        <script type="text/javascript">
            let theForm = document.getElementById("the-form");
            let serverResp = document.getElementById("server-resp");

            theForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                let form = e.currentTarget;
                let url = form.action;

                try {
                    let entries = Object.fromEntries(
                        new FormData(form).entries(),
                    );
                    entries["age"] = parseInt(entries["age"]);
                    let resp = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            Accept: "application/json",
                        },
                        body: JSON.stringify(entries),
                    });
                    serverResp.innerText = await resp.text();
                } catch (err) {
                    console.error(err);
                }
            });
        </script>
        <h2>Select a user ID</h2>
    </body>
</html>
